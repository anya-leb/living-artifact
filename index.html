<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Living Artifact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Newsreader:ital,opsz,wght@1,6..72,300&display=swap">
<style>
/* Layout: one full-bleed WebGL stage; a small museum placard sits centred near the lower edge. */
:root{
  --void:#030407;          /* the room: near-black with a blue bias */
  --ink:#e9e3d7;           /* porcelain white for the placard */
  --ink-dim:rgba(233,227,215,.42);
  --ember:#ffb070;         /* core light */
  --frost:#9fd8ff;         /* glass edge light */
  --font-display:"Marcellus","Trajan Pro",Georgia,serif;
  --font-note:"Newsreader",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:crosshair;-webkit-tap-highlight-color:transparent}
#stage.hot{cursor:pointer}
#stage:focus-visible{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--frost) 40%,transparent)}
#veil{position:fixed;inset:0;background:var(--void);pointer-events:none;transition:opacity 3.2s cubic-bezier(.4,0,.2,1)}
#veil.lift{opacity:0}
.label{position:fixed;left:50%;bottom:calc(6.5vh + env(safe-area-inset-bottom,0px));transform:translate(-50%,0);
  text-align:center;pointer-events:none;display:grid;gap:.85rem;justify-items:center;
  width:max-content;max-width:calc(100vw - 32px);opacity:0;
  transition:opacity 2.4s ease,transform 2.4s cubic-bezier(.2,.7,.2,1)}
.label.show{opacity:1}
.label.gone{opacity:0;transform:translate(-50%,8px);transition-duration:2s}
#placard h1{margin:0;font:400 clamp(10.5px,1vw,12.5px)/1 var(--font-display);letter-spacing:.62em;padding-left:.62em;
  text-transform:uppercase;color:var(--ink);opacity:.66;text-wrap:balance}
#placard p,#whisper p{margin:0;font:300 italic clamp(13px,1.15vw,15px)/1.3 var(--font-note);color:var(--ink-dim);letter-spacing:.02em}
#placard .rule{width:28px;height:1px;background:color-mix(in srgb,var(--ember) 45%,transparent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){ #veil,.label{transition-duration:.8s} }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" role="img" aria-label="The Living Artifact: a floating sculpture of glass petals, liquid metal and porcelain. Press Enter to open it."></canvas>
<div id="veil"></div>
<div id="placard" class="label" aria-live="polite">
  <h1>The Living Artifact</h1>
  <span class="rule" aria-hidden="true"></span>
  <p id="hint">Move your cursor.</p>
</div>
<div id="whisper" class="label" aria-live="polite"><p id="whisperText">Click to open it.</p></div>
<p class="sr">Move the pointer to turn the sculpture. Click it, or press Enter, to watch it bloom and reassemble.</p>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/*
  The Living Artifact. One file, five modules plus a small shared core:

    shared        helpers, device flags, renderer, GLSL, the simulation clock
    stage         scene, camera, studio environment, room and lights
    artifact      the sculpture: materials, parts, motion, the bloom
    particles     motes, dust, sparks and the cursor field that disturbs them
    post          composer: clamp, bloom glow, tone mapping, lens finish
    input         pointer + keyboard, engagement and hover
    stateMachine  closed / opening / open / closing (step 1: closed only)

  Construction order matters: object ids and the Math.random() sequence
  are kept identical to v1 so the refactor renders pixel-for-pixel the same.
*/

/* =================================================================== shared · helpers */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const rand = (a, b) => a + Math.random() * (b - a);
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutBack = (x, s = 1.2) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const noise1 = (() => {           // smooth 1D value noise, for motion that never quite repeats
  const P = new Float32Array(512); for (let i = 0; i < 512; i++) P[i] = Math.random() * 2 - 1;
  return x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(P[i & 511], P[(i + 1) & 511], u); };
})();
const spring = () => ({ x: 0, v: 0 });
const stepSpring = (s, target, k, c, dt) => { s.v += (k * (target - s.x) - c * s.v) * dt; s.x += s.v * dt; };

/* =================================================================== shared · page, device, renderer */
const canvas = document.getElementById('stage');
const veil = document.getElementById('veil');
const placard = document.getElementById('placard');
const hint = document.getElementById('hint');
const whisper = document.getElementById('whisper');
const whisperText = document.getElementById('whisperText');

const mqReduce = matchMedia('(prefers-reduced-motion: reduce)');
const COARSE = matchMedia('(pointer: coarse)').matches;
const device = {
  reduced: mqReduce.matches,
  coarse: COARSE,
  lite: COARSE || Math.min(innerWidth, innerHeight) < 640
};
mqReduce.addEventListener?.('change', e => { device.reduced = e.matches; });
if (device.coarse) { hint.textContent = 'Touch and drag.'; whisperText.textContent = 'Tap it to open.'; }

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  veil.classList.add('lift');
  hint.textContent = 'This piece needs WebGL, which is turned off in this browser.';
  placard.classList.add('show');
  throw err;
}
const MAX_DPR = Math.min(window.devicePixelRatio || 1, device.lite ? 1.5 : 2);
let dpr = MAX_DPR;
renderer.setPixelRatio(dpr);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* =================================================================== shared · GLSL */
const NOISE = /* glsl */`
vec3 laMod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 laMod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 laPermute(vec4 x){ return laMod289(((x*34.0)+1.0)*x); }
vec4 laTaylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
float laNoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = laMod289(i);
  vec4 p = laPermute(laPermute(laPermute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 q0 = vec3(a0.xy, h.x);
  vec3 q1 = vec3(a0.zw, h.y);
  vec3 q2 = vec3(a1.xy, h.z);
  vec3 q3 = vec3(a1.zw, h.w);
  vec4 norm = laTaylorInvSqrt(vec4(dot(q0,q0), dot(q1,q1), dot(q2,q2), dot(q3,q3)));
  q0 *= norm.x; q1 *= norm.y; q2 *= norm.z; q3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(q0,x0), dot(q1,x1), dot(q2,x2), dot(q3,x3)));
}`;

const UV_VERT = /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

/* =================================================================== shared · clock */
// clock: real seconds since start. simT: ambient time, slowed during the bloom's slow-motion beat.
const sim = { clock: 0, simT: 0, sdt: 0 };
const U = { time: { value: 0 } };   // shader time shared by every animated material

/* =================================================================== stage */
function createStage() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030407);
  scene.fog = new THREE.FogExp2(0x030407, 0.05);

  const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 90);
  camera.position.set(0, 0.4, 9);

  // Studio environment: a black room with a few softboxes, so metal and glass have something to reflect.
  function buildEnvironment() {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = new THREE.Scene();
    env.background = new THREE.Color(0x010102);
    // soft-edged emitters, so reflections read as feathered streaks instead of hard rectangles
    const softMat = (hex, power) => new THREE.ShaderMaterial({
      side: THREE.DoubleSide,
      uniforms: { uColor: { value: new THREE.Color(hex).multiplyScalar(power) } },
      vertexShader: UV_VERT,
      fragmentShader: `uniform vec3 uColor; varying vec2 vUv;
        void main(){ vec2 q = abs(vUv - 0.5) * 2.0; float a = (1.0 - smoothstep(0.1, 1.0, q.x)) * (1.0 - smoothstep(0.55, 1.0, q.y));
          gl_FragColor = vec4(uColor * a, 1.0); }`
    });
    const strip = (w, h, hex, power, pos) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), softMat(hex, power));
      m.position.set(...pos); m.lookAt(0, 0, 0); env.add(m);
    };
    const halo = new THREE.Mesh(new THREE.TorusGeometry(3.2, 0.12, 12, 96),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(0xfff0dc).multiplyScalar(2.6) }));
    halo.rotation.x = Math.PI / 2; halo.position.y = 8; env.add(halo);   // overhead ring light
    strip(0.9, 11, 0x9ad4ff, 2.4, [-7, 1, 1.5]);   // cool strip, left
    strip(0.9, 11, 0xffae80, 1.8, [7, 0.4, -2]);   // warm strip, right
    strip(12, 0.7, 0xffffff, 0.9, [0, -2.5, -8]);  // low horizon line behind
    strip(1.4, 5, 0xc6a2ff, 0.9, [4, 2, 7]);       // violet kicker, front
    strip(0.6, 3, 0xffffff, 1.2, [-3.5, -0.5, 7]); // thin front fill
    const tex = pmrem.fromScene(env, 0.02).texture;
    pmrem.dispose();
    return tex;
  }
  scene.environment = buildEnvironment();
  if ('environmentIntensity' in scene) scene.environmentIntensity = 1.0;

  // Background dome: fog-coloured, with a faint cold haze behind the piece.
  const dome = new THREE.Mesh(new THREE.SphereGeometry(45, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { uTime: U.time, uFog: { value: scene.fog.color } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform float uTime; uniform vec3 uFog; varying vec3 vDir; ${NOISE}
      void main(){
        vec3 d = normalize(vDir);
        float back = max(dot(d, vec3(0.0, 0.08, -1.0)), 0.0);
        float haze = pow(back, 6.0);
        float n = laNoise(d * 2.2 + vec3(uTime * 0.012, 0.0, uTime * 0.008)) * 0.5 + 0.5;
        vec3 col = uFog + vec3(0.0022, 0.0034, 0.0062) * haze * (0.6 + 0.8 * n) + vec3(0.0012, 0.0010, 0.0016) * n * n * smoothstep(-0.1, 0.4, d.y);
        gl_FragColor = vec4(col, 1.0);
      }`
  }));
  dome.renderOrder = -1;
  scene.add(dome);

  // Floor: catches the spotlight pool and the artifact's shadow, then dissolves into fog.
  const floorY = -2.35;
  const floor = new THREE.Mesh(new THREE.CircleGeometry(34, 72),
    new THREE.MeshStandardMaterial({ color: 0x0d0e12, roughness: 0.88, metalness: 0, envMapIntensity: 0.06 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = floorY; floor.receiveShadow = true;
  scene.add(floor);

  /* lights */
  const spot = new THREE.SpotLight(0xfff1de, 150, 0, 0.34, 0.85, 2);
  spot.position.set(0.6, 7.6, 1.1);
  spot.target.position.set(0, floorY, 0);
  spot.castShadow = true;
  spot.shadow.mapSize.set(device.lite ? 1024 : 2048, device.lite ? 1024 : 2048);
  spot.shadow.camera.near = 3; spot.shadow.camera.far = 14;
  spot.shadow.bias = -0.0003; spot.shadow.normalBias = 0.02;
  if ('intensity' in spot.shadow) spot.shadow.intensity = 0.82;
  scene.add(spot, spot.target);

  const rim = new THREE.DirectionalLight(0x86bfff, 1.9); rim.position.set(-4.5, 2.5, -5); scene.add(rim);
  const key = new THREE.DirectionalLight(0xffd6ae, 0.5); key.position.set(4, 1.2, 4.5); scene.add(key);
  scene.add(new THREE.HemisphereLight(0x1b2638, 0x050506, 0.35));
  const coreLight = new THREE.PointLight(0xffa35c, 3, 0, 2); scene.add(coreLight);

  const BASE_FOV = 34;
  let baseDist = 8.0;
  const camPos = new THREE.Vector3(0, 0.4, 9.5);

  function resize(aspect) {
    camera.aspect = aspect; camera.updateProjectionMatrix();
    const halfTan = Math.tan(THREE.MathUtils.degToRad(BASE_FOV / 2));
    baseDist = Math.max(8.0, 2.05 / (halfTan * camera.aspect));
  }

  // camera: vertical mouse raises the eye, horizontal adds parallax; the bloom pulls back.
  // Lights follow the viewer so different surfaces catch them.
  function update(dt, input, art) {
    const { simT } = sim, open = art.view.open, B = art.view.B, engage = input.engage;
    const dist = baseDist + open * 0.9 + (1 - art.view.intro) * 2.6;
    const tx = input.x * 0.55 * engage + Math.sin(simT * 0.13) * 0.05;
    const ty = 0.38 + input.y * 0.85 * engage + Math.sin(simT * 0.17) * 0.03 + open * 0.2;
    camPos.x = damp(camPos.x, tx, 2.2, dt); camPos.y = damp(camPos.y, ty, 2.2, dt); camPos.z = damp(camPos.z, dist, 2.2, dt);
    camera.position.copy(camPos);
    camera.lookAt(0, -0.12 + input.y * 0.08 * engage, 0);
    const fov = BASE_FOV + (device.reduced ? 0 : open * 3 + B.flash * 1.5);
    if (Math.abs(camera.fov - fov) > 1e-3) { camera.fov = fov; camera.updateProjectionMatrix(); }

    rim.position.set(-4.5 - input.x * 3 * engage, 2.5 + input.y * 1.5 * engage, -5);
    key.position.set(4 - input.x * 1.5 * engage, 1.2 + input.y * 2 * engage, 4.5);
    if (scene.environmentRotation) scene.environmentRotation.y = simT * 0.02 + input.x * 0.5 * engage;
  }

  return { scene, camera, spot, coreLight, resize, update };
}

/* =================================================================== artifact */
function createArtifact({ scene, spot, coreLight }) {
  /* ---- materials */
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: 0.04, transmission: 1, thickness: 0.95, ior: 1.52,
    dispersion: 0.9, iridescence: 0.95, iridescenceIOR: 1.33, iridescenceThicknessRange: [140, 520],
    attenuationColor: new THREE.Color(0xb6e2ff), attenuationDistance: 0.9,
    specularIntensity: 1, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.6,
    side: THREE.DoubleSide, depthWrite: false
  });
  // Glass edges catch the core's light: a fresnel rim that brightens on hover and when the petals open.
  const glassRim = { uRim: { value: 0.1 }, uRimColor: { value: new THREE.Color(0.75, 0.9, 1.0) } };
  glassMat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, glassRim);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uRim; uniform vec3 uRimColor;`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float laF = pow(1.0 - abs(dot(normal, normalize(vViewPosition))), 3.0);
        totalEmissiveRadiance += uRimColor * laF * uRim;`);
  };
  glassMat.customProgramCacheKey = () => 'living-artifact-glass';
  const chromeMat = new THREE.MeshPhysicalMaterial({ color: 0xdfe5ee, metalness: 1, roughness: 0.1, envMapIntensity: 1.4, clearcoat: 0.4 });
  const goldMat = new THREE.MeshPhysicalMaterial({ color: 0xe2b77d, metalness: 1, roughness: 0.2, envMapIntensity: 1.25 });
  const porcelainMat = new THREE.MeshPhysicalMaterial({
    color: 0xf2ede5, roughness: 0.32, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.07,
    sheen: 0.45, sheenColor: new THREE.Color(0xfff3e6), sheenRoughness: 0.55, envMapIntensity: 0.85
  });

  // Liquid metal: a displaced chrome sphere whose surface opens into molten-edged holes.
  const BU = {
    uTime: { value: 0 }, uAmp: { value: 0.07 }, uHole: { value: 0.34 },
    uGlow: { value: 1.2 }, uGlowColor: { value: new THREE.Color(1.0, 0.5, 0.2) }
  };
  const blobMat = new THREE.MeshPhysicalMaterial({ color: 0xd3d9e2, metalness: 1, roughness: 0.07, envMapIntensity: 1.5, side: THREE.DoubleSide });
  blobMat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, BU);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uTime; uniform float uAmp;
        varying vec3 vLaDir;
        ${NOISE}
        vec3 laDisplace(vec3 d){
          float n = laNoise(d * 1.5 + vec3(0.0, uTime * 0.35, uTime * 0.1)) * 0.7 + laNoise(d * 3.2 - vec3(uTime * 0.22)) * 0.3;
          return d * (1.0 + uAmp * n);
        }`)
      .replace('#include <beginnormal_vertex>', `
        vec3 laN = normalize(position);
        vec3 laRef = abs(laN.y) > 0.98 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
        vec3 laT = normalize(cross(laN, laRef));
        vec3 laB = cross(laN, laT);
        vec3 laP0 = laDisplace(laN);
        vec3 laP1 = laDisplace(normalize(laN + laT * 0.02));
        vec3 laP2 = laDisplace(normalize(laN + laB * 0.02));
        vec3 objectNormal = normalize(cross(laP1 - laP0, laP2 - laP0));
        vLaDir = laN;
        #ifdef USE_TANGENT
          vec3 objectTangent = vec3( tangent.xyz );
        #endif`)
      .replace('#include <begin_vertex>', `vec3 transformed = laP0;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uTime; uniform float uHole; uniform float uGlow; uniform vec3 uGlowColor;
        varying vec3 vLaDir;
        ${NOISE}`)
      .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
        float laH = laNoise(vLaDir * 2.2 + vec3(uTime * 0.11, -uTime * 0.07, uTime * 0.05)) * 0.75
                  + laNoise(vLaDir * 5.5 - uTime * 0.09) * 0.25;
        if (laH > uHole) discard;
        float laEdge = smoothstep(uHole - 0.16, uHole, laH);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += uGlowColor * uGlow * laEdge * laEdge;
        if (!gl_FrontFacing) totalEmissiveRadiance += uGlowColor * uGlow * 0.12;`);
  };
  blobMat.customProgramCacheKey = () => 'living-artifact-blob';

  const coreMat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.time, uIntensity: { value: 2 },
      uHot: { value: new THREE.Color(1.0, 0.94, 0.82) }, uEdge: { value: new THREE.Color(1.0, 0.42, 0.14) } },
    vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vP;
      void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); vP = position; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float uTime, uIntensity; uniform vec3 uHot, uEdge; varying vec3 vN, vV, vP; ${NOISE}
      void main(){
        float f = 1.0 - max(dot(normalize(vN), normalize(vV)), 0.0);
        float n = laNoise(vP * 3.5 + vec3(0.0, uTime * 0.7, uTime * 0.3)) * 0.5 + 0.5;
        vec3 c = mix(uHot, uEdge, clamp(f * 1.2 + n * 0.3 - 0.1, 0.0, 1.0));
        gl_FragColor = vec4(c * uIntensity * (0.75 + 0.5 * n) * (1.0 - 0.45 * f), 1.0);
      }`
  });

  function glowMaterial(color, falloff, depthTest = false) {
    return new THREE.ShaderMaterial({
      uniforms: { uColor: { value: color }, uIntensity: { value: 1 }, uFall: { value: falloff } },

  /* ---- structure */
  const floatRig = new THREE.Group(); scene.add(floatRig);   // bobbing + drift toward the cursor
  const leanRig = new THREE.Group(); floatRig.add(leanRig);   // tilt (mouse Y, lean, tumble)
  const spinRig = new THREE.Group(); leanRig.add(spinRig);    // yaw (mouse X, momentum, idle, bloom spin)
  const breathRig = new THREE.Group(); spinRig.add(breathRig);

  const shadowy = (m) => { m.castShadow = true; return m; };

  // glowing core
  const core = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), coreMat);

  breathRig.add(core);

  // liquid metal
  const blob = shadowy(new THREE.Mesh(new THREE.SphereGeometry(1, 144, 96), blobMat));
  blob.scale.setScalar(0.5);

  // glass petals: a twisted bud of lens-shaped shards, each hinged at its lower tip
  const PETALS = 7;
  function petalGeometry(n) {
    const segU = 18, segV = 46, th0 = 0.17, th1 = Math.PI - 0.34;
    const half = (Math.PI / n) * 0.9, twist = 0.55;
    const pos = [], idx = [];

  const petalGeo = petalGeometry(PETALS);
  const petalTip = new THREE.Vector3(0, Math.cos(Math.PI - 0.34), Math.sin(Math.PI - 0.34));
  const petals = [];
  for (let i = 0; i < PETALS; i++) {
    const arm = new THREE.Group(); arm.rotation.y = i / PETALS * TAU;
    const hinge = new THREE.Group(); hinge.position.copy(petalTip);
    const mesh = shadowy(new THREE.Mesh(petalGeo, glassMat)); mesh.position.copy(petalTip).negate();
    hinge.add(mesh); arm.add(hinge); breathRig.add(arm);
    petals.push({ hinge, seed: Math.random(), sgn: i % 2 ? 1 : -1 });
  }

  // porcelain calyx with a scalloped lip and a gold inlay band
  const calyx = new THREE.Group(); breathRig.add(calyx);
  {
    const prof = [[0.001, -1.30], [0.10, -1.295], [0.2, -1.26], [0.31, -1.19], [0.42, -1.09], [0.52, -0.97], [0.6, -0.86],
      [0.66, -0.78], [0.678, -0.742], [0.66, -0.73], [0.6, -0.79], [0.5, -0.915], [0.38, -1.025], [0.24, -1.105], [0.1, -1.145], [0.001, -1.155]]
      .map(([x, y]) => new THREE.Vector2(x, y));
    const g = new THREE.LatheGeometry(prof, 144);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i), rr = Math.hypot(x, z), phi = Math.atan2(z, x);
      p.setY(i, p.getY(i) + 0.032 * Math.cos(phi * PETALS) * smooth(0.45, 0.678, rr));
    }
    g.computeVertexNormals();
    calyx.add(shadowy(new THREE.Mesh(g, porcelainMat)));
    const band = shadowy(new THREE.Mesh(new THREE.TorusGeometry(0.603, 0.009, 10, 180), goldMat));
    band.rotation.x = Math.PI / 2; band.position.y = -0.86; calyx.add(band);
    const knot = shadowy(new THREE.Mesh(new THREE.SphereGeometry(0.05, 32, 16), goldMat));
    knot.position.y = -1.3; calyx.add(knot);
  }

  // crown: porcelain bead with metal stamens tipped in light
  const crown = new THREE.Group(); crown.position.y = 1.0; breathRig.add(crown);
  {
    const bead = shadowy(new THREE.Mesh(new THREE.SphereGeometry(0.062, 32, 20), porcelainMat)); bead.scale.set(1, 0.85, 1); crown.add(bead);
    const ring = shadowy(new THREE.Mesh(new THREE.TorusGeometry(0.068, 0.007, 8, 48), goldMat)); ring.rotation.x = Math.PI / 2; crown.add(ring);
  }
  const TIP_COLORS = [new THREE.Color(0.55, 1.35, 2.1), new THREE.Color(2.2, 1.35, 0.6)];
  const tendrils = [];
  for (let k = 0; k < 5; k++) {
    const arm = new THREE.Group(); arm.rotation.y = k / 5 * TAU + 0.4;
    const pivot = new THREE.Group(); arm.add(pivot); crown.add(arm);
    const L = rand(0.62, 1.0), c = rand(0.75, 1.2);
    const pts = [[0, 0, 0], [0, 0.2, 0.03], [0, 0.45, 0.1], [0, 0.68, 0.22], [0, 0.86, 0.36], [0, 0.95, 0.5], [0, 0.93, 0.6], [0, 0.86, 0.64]]
      .map(([x, y, z]) => new THREE.Vector3(x, y * L, z * c * L));
    const curve = new THREE.CatmullRomCurve3(pts);
    pivot.add(shadowy(new THREE.Mesh(new THREE.TubeGeometry(curve, 64, 0.0085, 6, false), k % 2 ? goldMat : chromeMat)));
    const base = TIP_COLORS[k % 2];
    const tipMat = new THREE.MeshBasicMaterial({ color: base.clone() });
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.024, 16, 12), tipMat);
    tip.position.copy(pts[pts.length - 1]); pivot.add(tip);
    tendrils.push({ pivot, tipMat, base, seed: Math.random() * 100 });
  }

  // kinetic rings: two gimballed hoops carrying porcelain and light beads
  const beadGeo = new THREE.SphereGeometry(1, 24, 16);
  function makeRing(radius, tube, mat, tiltX, tiltZ, beads) {
    const prec = new THREE.Group(), tilt = new THREE.Group(), carrier = new THREE.Group();
    tilt.rotation.set(tiltX, 0, tiltZ); prec.add(tilt); tilt.add(carrier);
    tilt.add(shadowy(new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 8, 260), mat)));
    for (const [ang, r, m] of beads) {
      const b = shadowy(new THREE.Mesh(beadGeo, m)); b.scale.setScalar(r);
      b.position.set(Math.cos(ang) * radius, Math.sin(ang) * radius, 0); carrier.add(b);
    }
    spinRig.add(prec);
    return { prec, tilt, carrier, tiltX };
  }
  const beadGlowA = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 1.5, 0.7) });
  const beadGlowB = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.7, 1.6, 2.4) });
  const ringA = makeRing(1.36, 0.0065, chromeMat, Math.PI / 2 - 0.42, 0.15,
    [[0, 0.045, porcelainMat], [2.1, 0.034, porcelainMat], [2.35, 0.018, beadGlowA], [4.2, 0.04, porcelainMat]]);
  const ringB = makeRing(1.52, 0.0042, goldMat, Math.PI / 2 + 0.62, -0.35,
    [[1.0, 0.03, porcelainMat], [3.9, 0.016, beadGlowB]]);

  // pendant: a thread and a drop of liquid metal that swings on its own
  const pendant = new THREE.Group(); leanRig.add(pendant);
  const threadGeo = new THREE.CylinderGeometry(0.0032, 0.0032, 1, 6); threadGeo.translate(0, -0.5, 0);
  const thread = new THREE.Mesh(threadGeo, goldMat); pendant.add(thread);
  const drop = shadowy(new THREE.Mesh(new THREE.SphereGeometry(0.07, 48, 32), chromeMat)); drop.scale.set(1, 1.3, 1); pendant.add(drop);
  const threadBead = shadowy(new THREE.Mesh(beadGeo, porcelainMat)); threadBead.scale.setScalar(0.022); pendant.add(threadBead);

  // light that lives outside the rigs (billboards)
  const coreGlow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), glowMaterial(new THREE.Color(1.0, 0.58, 0.28), 5.0));
  coreGlow.renderOrder = 10; scene.add(coreGlow);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), glowMaterial(new THREE.Color(0.22, 0.38, 0.75), 3.0, true));
  halo.scale.setScalar(10); scene.add(halo);
  const shock = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
    uniforms: { uP: { value: 0 }, uColor: { value: new THREE.Color(1.0, 0.78, 0.55) } },
    transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
    vertexShader: UV_VERT,
    fragmentShader: `uniform float uP; uniform vec3 uColor; varying vec2 vUv;
      void main(){ float d = length(vUv - 0.5) * 2.0; float w = 0.015 + 0.14 * uP;
        float ring = exp(-pow((d - uP) / w, 2.0)); float fade = (1.0 - uP) * (1.0 - uP);
        gl_FragColor = vec4(uColor * ring * fade * 2.2, 1.0); }`
  }));
  shock.scale.setScalar(7.5); shock.visible = false; shock.renderOrder = 11; scene.add(shock);

  // a soft beam falling from the spotlight onto the piece
  const beamGeo = new THREE.CylinderGeometry(0.22, 2.3, 10, 64, 1, true); beamGeo.translate(0, -5, 0);
  const beamMat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.time, uIntensity: { value: 1 }, uColor: { value: new THREE.Color(1.0, 0.9, 0.78) } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: `varying float vH; varying vec3 vN; varying vec3 vV; varying vec3 vW;
      void main(){ vH = -position.y / 10.0; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vec4 mv = viewMatrix * w;

    fragmentShader: `uniform float uTime, uIntensity; uniform vec3 uColor; varying float vH; varying vec3 vN, vV, vW; ${NOISE}
      void main(){ float f = pow(abs(dot(normalize(vN), normalize(vV))), 1.8);
        float fall = smoothstep(0.0, 0.25, vH) * (1.0 - smoothstep(0.5, 1.0, vH));

  const beam = new THREE.Mesh(beamGeo, beamMat);
  beam.position.copy(spot.position);
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), spot.target.position.clone().sub(spot.position).normalize());
  scene.add(beam);

  /* ---- motion state */
  const rotY = spring(), rotX = spring(), leanX = spring(), leanZ = spring(), shX = spring(), shY = spring(), pendX = spring(), pendZ = spring();
  let prox = 0, freeV = 0, freeA = 0, autoA = 0;
  let shiver = 0, ringKick = 0, pulse = 0;
  const tmpV = new THREE.Vector3(), coreW = new THREE.Vector3(), camDir = new THREE.Vector3();

  // What the other modules read each frame.
  const B = { open: 0, flash: 0, spin: 0, slow: 1, tilt: 0 };
  const view = { open: 0, br: 0, intro: 0, heat: 0, pulse: 0, B };

  /* ---- the bloom (v1 behaviour; step 2 replaces it with the opening/closing timelines) */
  let bloomT = -1, burstFired = false, snapFired = false, shockT = -1;
  // petals: tiny inhale, burst open with overshoot, hold, then close with a soft click
  function openCurve(t) {
    if (t <= 0) return 0;

    if (t < 4.3) return 1 - easeInOutCubic((t - 2.5) / 1.8);
    if (t < 4.7) return -0.035 * Math.sin(Math.PI * (t - 4.3) / 0.4);
    return 0;
  }
  function startBloom() {
    if (bloomT >= 0) return false;
    bloomT = 0; burstFired = false; snapFired = false;
    return true;
  }
  function advanceBloom(dt) {
    B.open = 0; B.flash = 0; B.spin = 0; B.slow = 1; B.tilt = 0;

      B.open = openCurve(t);

        B.tilt = Math.sin(sp * Math.PI) * 0.22;

  }

  /* ---- surprises: the piece occasionally does something of its own. Returns a particle burst, if any. */
  function surprise() {
    const sgn = Math.random() < 0.5 ? -1 : 1;
    let burst = 0;
    switch (Math.floor(Math.random() * 5)) {
      case 0: rotY.v += sgn * rand(1.4, 2.4); leanX.v += rand(-0.6, 0.6); break;   // a glance
      case 1: shiver = 1; break;                                                    // petals flutter
      case 2: pulse = 1; burst = 0.7; break;                                         // a heartbeat
      case 3: ringKick = sgn * 2.6; break;                                           // rings realign
      case 4: pendZ.v += sgn * 2.2; pendX.v += rand(-1, 1); break;                  // the drop swings
    }
    return burst;
  }

  /* ---- motion: springs toward the cursor, momentum, idle float and breath */
  function updateMotion(dt, input, camera) {
    const { simT, sdt } = sim, hover = input.hover, engage = input.engage;
    shiver *= Math.exp(-2.2 * dt); ringKick *= Math.exp(-1.2 * dt); pulse *= Math.exp(-2.5 * dt);

    // where is the artifact on screen, and how close is the cursor?
    camera.updateMatrixWorld();
    floatRig.getWorldPosition(tmpV); tmpV.project(camera);
    if (!Number.isFinite(tmpV.x) || !Number.isFinite(tmpV.y)) tmpV.set(0, 0, 0);
    const ldx = (input.x - tmpV.x) * camera.aspect, ldy = input.y - tmpV.y, ld = Math.hypot(ldx, ldy) + 1e-4;
    prox = damp(prox, input.inside ? (1 - smooth(0.3, 1.35, ld)) : 0, 3, dt);
    const leanAmt = prox * smooth(0.04, 0.35, ld), nx = ldx / ld, ny = ldy / ld;

    stepSpring(rotX, input.y * 0.38 * engage, 16, 4.6, dt);

    stepSpring(leanX, -ny * 0.16 * leanAmt, 22, 5.5, dt);
    stepSpring(shX, nx * 0.09 * leanAmt, 14, 5, dt);
    stepSpring(shY, ny * 0.06 * leanAmt, 14, 5, dt);

    // idle life

    const fy = (Math.sin(simT * 0.61) * 0.075 + Math.sin(simT * 0.23 + 1.3) * 0.045 + noise1(simT * 0.35 + 10) * 0.03) * floatAmp;
    const fx = (Math.sin(simT * 0.29 + 0.7) * 0.03 + noise1(simT * 0.2 + 30) * 0.02) * floatAmp;
    const br = Math.sin(simT * 0.85 + Math.sin(simT * 0.13) * 1.8);

  /* ---- parts: petals, core, liquid metal, crown, calyx, rings, pendant */
  function updateParts(dt, input) {
    const { clock, simT, sdt } = sim, hover = input.hover, open = view.open, br = view.br;

    for (let i = 0; i < PETALS; i++) {
      const p = petals[i];
      const oi = bloomT >= 0 ? openCurve(bloomT - i * 0.035) : 0;
      const wob = hover * 0.07 * Math.sin(clock * 1.6 + p.seed * 20) + shiver * 0.07 * Math.sin(clock * 34 + i * 1.7) + br * 0.018;
      p.hinge.rotation.set(oi * 0.95 + wob, oi * 0.25 * p.sgn, oi * 0.38 * p.sgn);
      p.hinge.position.set(0, petalTip.y + Math.max(0, oi) * (0.12 + 0.22 * p.seed), petalTip.z + oi * (0.45 + 0.2 * p.seed));
    }

    const heat = hover + pulse * 0.6;
    view.heat = heat; view.pulse = pulse;
    glassRim.uRim.value = 0.12 + heat * 0.25 + open * 1.1 + B.flash * 1.5;
    glassRim.uRimColor.value.setRGB(lerp(0.75, 1.0, open), lerp(0.9, 0.72, open), lerp(1.0, 0.5, open));
    core.scale.setScalar(0.19 * (1 + open * 0.55 + B.flash * 0.25 + pulse * 0.1));
    coreMat.uniforms.uIntensity.value = 2.2 + heat * 1.8 + open * 3.5 + B.flash * 8;
    BU.uTime.value += dt * (1 + hover * 1.2 + open * 2);
    BU.uAmp.value = 0.07 + hover * 0.04 + open * 0.12 + br * 0.01;

    crown.rotation.y = -autoA * 0.4 + open * 1.2 + noise1(simT * 0.3 + 5) * 0.2 * hover;
    for (let k = 0; k < tendrils.length; k++) {

      t.pivot.rotation.x = 0.1 + amp * noise1(simT * 0.5 + t.seed) + shiver * 0.08 * Math.sin(clock * 30 + k) + open * 0.75;
      t.pivot.rotation.z = amp * 0.8 * noise1(simT * 0.45 + t.seed + 100);
      t.tipMat.color.copy(t.base).multiplyScalar(1.4 + heat * 2 + open * 3 + B.flash * 4);
    }

    calyx.position.y = -open * 0.4 + Math.sin(simT * 0.9 + 1) * 0.008 * (1 + hover * 3);
    calyx.rotation.y = simT * 0.04 - open * 0.9;
    ringA.prec.rotation.y += sdt * (0.22 + hover * 0.8 + open * 2.6 + ringKick);
    ringA.carrier.rotation.z += sdt * (0.35 + hover * 1.4 + open * 2);
    ringA.tilt.rotation.x = ringA.tiltX + Math.sin(simT * 0.21) * 0.08 + open * 0.5;
    ringA.prec.scale.setScalar(1 + open * 0.28);
    ringB.prec.rotation.y -= sdt * (0.15 + hover * 0.6 + open * 1.8 + ringKick * 0.6);
    ringB.carrier.rotation.z -= sdt * (0.25 + hover * 1.1 + open * 1.5);
    ringB.tilt.rotation.x = ringB.tiltX + Math.sin(simT * 0.17 + 2) * 0.1 - open * 0.45;
    ringB.prec.scale.setScalar(1 + open * 0.42);
    beadGlowA.color.setRGB(2.4, 1.5, 0.7).multiplyScalar(1 + heat * 0.8 + open * 1.5);
    beadGlowB.color.setRGB(0.7, 1.6, 2.4).multiplyScalar(1 + heat * 0.8 + open * 1.5);

    stepSpring(pendX, -leanRig.rotation.x, 9, 0.8, dt);
    stepSpring(pendZ, -leanRig.rotation.z, 9, 0.8, dt);
    const len = 0.22 + open * 0.3;
    pendant.position.y = (-1.3 - open * 0.4) * breathRig.scale.y;
    pendant.rotation.set(pendX.x, 0, pendZ.x);
    thread.scale.y = len; threadBead.position.y = -len * 0.55; drop.position.y = -(len + 0.09);

  /* ---- light that follows the core: point light, billboards, the spotlight beam */
  function updateGlow(camera, input) {
    const open = view.open, heat = view.heat, hover = input.hover;
    core.getWorldPosition(coreW);
    coreLight.position.copy(coreW);
    coreLight.intensity = 0.9 + heat * 1.2 + open * 4.5 + B.flash * 16;
    coreGlow.position.copy(coreW); coreGlow.quaternion.copy(camera.quaternion);
    coreGlow.scale.setScalar(1.3 * (1 + open * 0.35 + B.flash * 0.5 + hover * 0.1));
    coreGlow.material.uniforms.uIntensity.value = 0.42 + heat * 0.35 + open * 0.3 + B.flash * 1.1;
    camera.getWorldDirection(camDir);
    halo.position.copy(coreW).addScaledVector(camDir, 2.5); halo.quaternion.copy(camera.quaternion);
    halo.material.uniforms.uIntensity.value = 0.05 + hover * 0.025 + open * 0.06 + B.flash * 0.12;
    beamMat.uniforms.uIntensity.value = 1 + open * 0.4 + B.flash * 0.8;
  }

  /* ---- bloom events: burst, sparks and shockwave at the opening; an implosion when it snaps shut */
  function updateEffects(dt, camera, particles) {
    if (bloomT >= 0 && !burstFired && bloomT >= 0.27) {
      burstFired = true;
      particles.F.burst = device.reduced ? 1.4 : 3.8;
      particles.spawnSparks(coreW.x, coreW.y, coreW.z, device.reduced ? 0.35 : 1);
      shockT = 0; shock.visible = true;
    }

  // dust: the air of the room, mostly out of focus
  function createDust(N) {

    Object.assign(S, { home: new Float32Array(N * 3), f: new Float32Array(N * 3), s: new Float32Array(N * 3) });

      S.home.set([x, y, z], i * 3);
      S.f.set([rand(.5, 1.5), rand(.5, 1.5), rand(.5, 1.5)], i * 3);
      S.s.set([rand(0, TAU), rand(0, TAU), rand(0, TAU)], i * 3);

    const tx = F.dy * nz - F.dz * ny, ty = F.dz * nx - F.dx * nz, tz = F.dx * ny - F.dy * nx;
    const rep = F.rep * f2, sw = F.swirl * f2, dr = F.drag * f2;

    FA[1] = ny * rep + ty * sw + F.mvy * dr;

      off[i3] = ox; off[i3 + 1] = oy; off[i3 + 2] = oz; vel[i3] = vx; vel[i3 + 1] = vy; vel[i3 + 2] = vz;

  }

  return {
    F, update, syncUniforms,
    spawnSparks: (x, y, z, strength) => spawnSparks(sparks, x, y, z, strength),
    get mouseSpeed() { return mouseSpeed; }
  };
}

/* =================================================================== post */
function createPost({ scene, camera }) {
  const FinishShader = {
    uniforms: { tDiffuse: { value: null }, uCA: { value: 0.0015 }, uTime: { value: 0 }, uGrain: { value: 0.02 }, uRes: { value: new THREE.Vector2(1, 1) }, uAspect: { value: 1 } },
    vertexShader: UV_VERT,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float uCA, uTime, uGrain, uAspect; uniform vec2 uRes; varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main(){
        vec2 c = vUv - 0.5;
        float d2 = dot(c, c);
        vec2 off = c * uCA * (0.35 + d2 * 5.0);          // chromatic aberration grows toward the edges
        vec3 col = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
        vec2 q = c; q.x *= uAspect;
        col *= mix(0.42, 1.0, smoothstep(1.05, 0.22, length(q)));
        col += (hash(vUv * uRes + fract(uTime * 7.13) * 91.7) - 0.5) * uGrain;
        gl_FragColor = vec4(col, 1.0);
      }`
  };
  const rt = new THREE.WebGLRenderTarget(innerWidth * dpr, innerHeight * dpr, { type: THREE.HalfFloatType, samples: device.lite ? 0 : 4 });
  const composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  // Tame razor-sharp specular peaks (and any stray NaN) before bloom, or they bloom into blocky squares.
  composer.addPass(new ShaderPass({
    uniforms: { tDiffuse: { value: null } },
    vertexShader: UV_VERT,
    fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
      void main(){ vec4 c = texture2D(tDiffuse, vUv);
        if (any(isnan(c.rgb)) || any(isinf(c.rgb))) c.rgb = vec3(0.0);
        float l = max(max(c.r, c.g), c.b);
        c.rgb *= l > 8.0 ? 8.0 / l : 1.0;
        gl_FragColor = vec4(c.rgb, 1.0); }`
  }));
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.5, 1.0);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());

  function setSize(w, h) {
    composer.setPixelRatio(dpr); composer.setSize(w, h);
    finish.uniforms.uRes.value.set(w * dpr, h * dpr);
    finish.uniforms.uAspect.value = w / h;
  }

    const open = view.open, B = view.B;
    finish.uniforms.uTime.value = device.reduced ? 0 : sim.clock;
    finish.uniforms.uCA.value = device.reduced ? 0.0012 : 0.0014 + B.flash * 0.012 + open * 0.0025 + Math.min(mouseSpeed, 4) * 0.0005;
    bloomPass.strength = 0.42 + input.hover * 0.08 + open * 0.12 + B.flash * 0.45 + view.pulse * 0.15;
  }
  return { setSize, update, render: () => composer.render() };
}

/* =================================================================== input */
function createInput({ canvas, camera, getCenter, onActivate, onEngage }) {
  const input = {
    x: 0, y: 0, px: 0, py: 0, inside: false, lastMove: -100, travel: 0, flickX: 0, flickY: 0, type: 'mouse',
    fieldReset: true,          // the particle field re-anchors the cursor after it re-enters
    engage: 0.2, hover: 0, hit: false
  };
  let press = null;
  function readPointer(e) {
    const nx = e.clientX / innerWidth * 2 - 1, ny = -(e.clientY / innerHeight * 2 - 1);
    if (input.inside) {
      input.flickX += nx - input.x; input.flickY += ny - input.y;
      const moved = Math.hypot(e.clientX - input.px, e.clientY - input.py);
      input.travel += moved; if (press) press.travel += moved;
    } else input.fieldReset = true;
    input.x = nx; input.y = ny; input.px = e.clientX; input.py = e.clientY;
    input.inside = true; input.lastMove = sim.clock; input.type = e.pointerType || 'mouse';
  }
  canvas.addEventListener('pointermove', e => { readPointer(e); if (input.travel > 90) onEngage(); });
  canvas.addEventListener('pointerdown', e => {
    readPointer(e);
    press = { t: sim.clock, travel: 0, hit: hoverTest() };
    if (device.coarse) onEngage();
  });
  canvas.addEventListener('pointerup', e => {
    if (press && press.hit && press.travel < 14 && sim.clock - press.t < 0.8) onActivate();
    press = null;
    if (e.pointerType !== 'mouse') input.inside = false;
  });
  canvas.addEventListener('pointercancel', () => { press = null; input.inside = false; });
  canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') input.inside = false; });
  canvas.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
  });

  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const hoverSphere = new THREE.Sphere(new THREE.Vector3(), 1.15);
  function hoverTest() {
    ndc.set(input.x, input.y); raycaster.setFromCamera(ndc, camera);
    getCenter(hoverSphere.center);
    return raycaster.ray.intersectsSphere(hoverSphere);
  }

  // attention: engagement fades when the cursor rests; hover eases in and out
  input.update = (dt) => {
    const idle = sim.clock - input.lastMove;
    const engT = input.inside ? (idle < 1.3 ? 1 : 0.3) : 0.2;
    input.engage = damp(input.engage, engT, engT > input.engage ? 3.5 : 0.45, dt);
    input.hit = input.inside && hoverTest();
    input.hover = damp(input.hover, input.hit ? 1 : 0, input.hit ? 4 : 1.8, dt);
    canvas.classList.toggle('hot', input.hit);
  };
  return input;
}

/* =================================================================== stateMachine */
// Step 1 stub: only `closed` exists, and activating plays the v1 bloom.
// Step 2 adds opening / open / closing, the URL hash and the GSAP timelines.
function createStateMachine({ onBloom }) {
  const sm = {
    state: 'closed',
    request(action) {
      if (action === 'activate' && sm.state === 'closed') onBloom();
    }
  };
  return sm;
}

/* =================================================================== assembly */
const stage = createStage();
const camera = stage.camera;
const artifact = createArtifact({ scene: stage.scene, spot: stage.spot, coreLight: stage.coreLight });
const particles = createParticles({ scene: stage.scene });
const post = createPost({ scene: stage.scene, camera });

/* sizing + adaptive quality */
function applySize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(dpr); renderer.setSize(w, h);
  post.setSize(w, h);
  stage.resize(w / h);
}
applySize();
addEventListener('resize', applySize);
let perfAcc = 0, perfN = 0;
function watchPerformance(raw) {
  if (sim.clock < 4 || raw > 0.2 || document.hidden) return;   // skip compile time, hiccups and throttled tabs
  perfAcc += raw; perfN++;
  if (perfAcc < 2.5) return;
  const avg = perfAcc / perfN; perfAcc = perfN = 0;
  if (avg > 1 / 42 && dpr > 1) { dpr = Math.max(1, dpr - 0.25); applySize(); }
}

/* intro copy: the placard, and the one-time "click to open" whisper */
let placardShownAt = Infinity, dismissWanted = false, dismissed = false;
let whisperShown = false, whisperAt = 0, hoverTime = 0, bloomedOnce = false;
function requestDismiss() { dismissWanted = true; }
function showWhisper() { if (whisperShown || bloomedOnce) return; whisperShown = true; whisperAt = sim.clock; whisper.classList.add('show'); }
function hideWhisper() { whisper.classList.remove('show'); whisper.classList.add('gone'); }
function updateCopy(dt, input) {
  hoverTime = input.hit ? hoverTime + dt : 0;
  if (hoverTime > 0.9 && !device.coarse) showWhisper();
  if (device.coarse && dismissed && !whisperShown && sim.clock - placardShownAt > 6) showWhisper();
  if (whisperShown && sim.clock - whisperAt > 4) hideWhisper();
}
function updatePlacard() {
  if (placardShownAt === Infinity && sim.clock > 1.6) { placardShownAt = sim.clock; placard.classList.add('show'); }
  if (dismissWanted && !dismissed && sim.clock > placardShownAt + 2.2) { dismissed = true; placard.classList.add('gone'); }
}

const sm = createStateMachine({
  onBloom() {
    if (!artifact.startBloom()) return;
    bloomedOnce = true; requestDismiss(); hideWhisper();
  }
});
const input = createInput({
  canvas, camera,
  getCenter: (v) => artifact.floatRig.getWorldPosition(v),
  onActivate: () => sm.request('activate'),
  onEngage: requestDismiss
});

let nextTwitch = rand(9, 15);

/* one simulation step; order matters (springs read the input, particles read the artifact) */
function tick(dt) {
  sim.clock += dt;
  artifact.advanceBloom(dt);
  sim.sdt = dt * artifact.view.B.slow;
  sim.simT += sim.sdt;

  input.update(dt);
  updateCopy(dt, input);

  if (!device.reduced && !artifact.blooming && sim.clock > nextTwitch) {
    nextTwitch = sim.clock + rand(7, 17);
    const burst = artifact.surprise();
    if (burst) particles.F.burst = burst;
  }

  artifact.updateMotion(dt, input, camera);
  artifact.updateParts(dt, input);
  stage.update(dt, input, artifact);
  artifact.updateGlow(camera, input);
  artifact.updateEffects(dt, camera, particles);
  particles.update(dt, input, camera, artifact);

  particles.syncUniforms(camera, artifact);
  U.time.value = sim.clock;
  post.update(artifact.view, input, particles.mouseSpeed);
  updatePlacard();
}

/* =================================================================== loop */
renderer.compile(stage.scene, camera);
let last = performance.now(), firstFrame = true;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.max(0, (now - last) / 1000); last = now;
  tick(Math.min(raw, 1 / 30));
  post.render();
  watchPerformance(raw);
  if (firstFrame) { firstFrame = false; requestAnimationFrame(() => veil.classList.add('lift')); }
}
requestAnimationFrame(frame);

// ?debug: step the simulation by hand (used by the refactor tests and later by the FPS/state overlay)
if (new URLSearchParams(location.search).has('debug')) {
  window.LA = {
    sm, sim, input, artifact,
    step(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) tick(dt); post.render(); }
  };
}
</script>
</body>
</html>
